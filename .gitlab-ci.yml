---
# Run the test suite and publish tagged releases to PyPI with uv.
#
# Trusted publishing for self-managed GitLab is a PyPI beta that requires
# onboarding by PyPI staff. This pipeline therefore uses a masked PyPI API
# token stored in the protected CI/CD variable `UV_PUBLISH_TOKEN`.

variables:
  UV_LINK_MODE: copy
  UV_CACHE_DIR: .uv-cache
  PYPI_TAG_PATTERN: '/^v[0-9]+\.[0-9]+\.[0-9]+(rc[0-9]+|a[0-9]+|b[0-9]+)?$/'

default:
  image: ghcr.io/astral-sh/uv:0.13.9-python3.12-trixie-slim
  cache:
    - key:
        files:
          - uv.lock
      paths:
        - .uv-cache
  after_script:
    - uv cache prune --ci

stages:
  - test
  - publish

check:
  stage: test
  script:
    - uv sync --locked --all-extras
    - uv run pytest
    - uvx ruff check src tests
    - uvx ruff format --check src tests

publish:
  stage: publish
  needs:
    - check
  environment:
    name: pypi
  rules:
    - if: '$CI_COMMIT_TAG =~ $PYPI_TAG_PATTERN'
  script:
    - |
      if [ -z "${UV_PUBLISH_TOKEN:-}" ]; then
        echo "UV_PUBLISH_TOKEN is not set" >&2
        exit 1
      fi
    - uv build --no-sources
    - uv run --isolated --no-project --with dist/*.whl tests/smoke_test.py
    - uv run --isolated --no-project --with dist/*.tar.gz tests/smoke_test.py
    - uv publish --check-url https://pypi.org/simple/
